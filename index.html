ithful Soul"}, {"t": "p", "x": "O most sweet Lord Jesus, how great is the pleasure of the devout soul that feasteth with Thee in Thy banquet; where there is set for her no other food to be eaten but Thyself, her only Beloved, and most to be desired above all the desires of her heart! To me also it would be indeed sweet, in Thy presence to pour forth tears from the very bottom of my heart, and with the grateful Magdalene to wash Thy feet with tears (Luke 7:38). But where is that devotion? Where that bountiful flowing of holy tears? Surely in the sight of Thee and Thy holy Angels, my whole heart ought to burn, and to weep for joy. For in this Sacrament I have Thee mystically present, hidden under another shape. For to look upon Thee in Thine own Divine brightness, mine eyes would not be able to endure; nor could even the whole world stand in the splendor of the glory of Thy majesty. Herein then Thou hast regard to my weakness, that Thou dost hide Thyself under this Sacrament."}, {"t": "src", "x": "From True Devotion To the Blessed Virgin Mary, Nos. 261-265"}, {"t": "sub", "x": "In Mary"}, {"t": "p", "x": "261. We must do everything in Mary. To understand this we must realise that the Blessed Virgin is the true earthly paradise of the new Adam and that the ancient paradise was only a symbol of her. There are in this earthly paradise untold riches, beauties, rarities and delights, which the new Adam, Jesus Christ, has left there. It is in this paradise that he \"took his delights\" for nine months, worked his wonders and displayed his riches with the magnificence of God himself.In this earthly paradise grows the real Tree of Life which bore our Lord, the fruit of Life, the tree of knowledge of good and evil, which bore the Light of the world. In this divine place there are trees planted by the hand of God and watered by his divine unction which have borne and continue to bear fruit that is pleasing to him. Only the Holy Spirit can teach us the truths that these material objects symbolise. 262. The Holy Spirit speaking through the Fathers of the Church, also calls our Lady the Eastern Gate, through which the High Priest, Jesus Christ, enters and goes out into the world. Through this gate he entered the world the first time and through this same gate he will come the second time."}, {"t": "sub", "x": "For Mary"}, {"t": "p", "x": "265. Finally, we must do everything for Mary. We take Mary for our proximate end, our mysterious intermediary and the easiest way of reaching him. Relying on her protection, we should undertake and carry out great things for our noble Queen. We must defend her privileges when they are questioned and uphold her good name when it is under attack. We must attract everyone, if possible, to her service and to this true and sound devotion. As a reward for these little services, we should expect nothing in return save the honour of belonging to such a lovable Queen and the joy of being united through her to Jesus, her Son, by a bond that is indissoluble in time and in eternity."}]}];
const PRAYERS = {
 "veni": "Come, Holy Spirit, Creator blest,\nand in our souls take up Thy rest;\ncome with Thy grace and heavenly aid\nto fill the hearts which Thou hast made.\n\nO comforter, to Thee we cry,\nO heavenly gift of God Most High,\nO fount of life and fire of love,\nand sweet anointing from above.\n\nThou in Thy sevenfold gifts are known;\nThou, finger of God's hand we own;\nThou, promise of the Father,\nThou Who dost the tongue with power imbue.\n\nKindle our sense from above,\nand make our hearts o'erflow with love;\nwith patience firm and virtue high\nthe weakness of our flesh supply.\n\nFar from us drive the foe we dread,\nand grant us Thy peace instead;\nso shall we not, with Thee for guide,\nturn from the path of life aside.\n\nOh, may Thy grace on us bestow\nthe Father and the Son to know;\nand Thee, through endless times confessed,\nof both the eternal Spirit blest.\n\nNow to the Father and the Son,\nWho rose from death, be glory given,\nwith Thou, O Holy Comforter,\nhenceforth by all in earth and heaven. Amen.",
 "ave": "Hail, O Star of the ocean,\nGod's own Mother blest,\never sinless Virgin,\ngate of heav'nly rest.\n\nTaking that sweet Ave,\nwhich from Gabriel came,\npeace confirm within us,\nchanging Eve's name.\n\nBreak the sinners' fetters,\nmake our blindness day,\nChase all evils from us,\nfor all blessings pray.\n\nShow thyself a Mother,\nmay the Word divine\nborn for us thine Infant\nhear our prayers through thine.\n\nVirgin all excelling,\nmildest of the mild,\nfree from guilt preserve us\nmeek and undefiled.\n\nKeep our life all spotless,\nmake our way secure\ntill we find in Jesus,\njoy for evermore.\n\nPraise to God the Father,\nhonor to the Son,\nin the Holy Spirit,\nbe the glory one. Amen.",
 "magnificat": "My soul doth magnify the Lord. And my spirit hath rejoiced in God my Savior. Because He hath regarded the humility of His handmaid; for behold, from henceforth all generations shall call me blessed. Because He that is mighty hath done great things to me; and holy is His name. And His mercy is from generation to generations, to them that fear Him. He hath showed might in His arm; He hath scattered the proud in the conceit of their heart.\n\nHe hath put down the mighty from their seat; and hath exalted the humble. He hath filled the hungry with good things; and the rich he hath sent empty away. He hath received Israel His servant, being mindful of His mercy. As He spoke to our fathers, to Abraham and to his seed forever. Amen.",
 "glory": "Glory be to the Father, and to the Son, and to the Holy Ghost. As it was in the beginning, is now, and ever shall be, world without end. Amen.",
 "litany-holy-ghost": "Lord, have mercy on us.\nChrist, have mercy on us.\nLord, have mercy on us.\n\nFather all powerful, have mercy on us\nJesus, Eternal Son of the Father, Redeemer of the world, save us.\nSpirit of the Father and the Son, boundless life of both, sanctify us.\nHoly Trinity, hear us\n\nHoly Ghost, Who proceedest from the Father and the Son, enter our hearts.\nHoly Ghost, Who art equal to the Father and the Son, enter our hearts.\n\nPromise of God the Father, have mercy on us.\nRay of heavenly light, have mercy on us\nAuthor of all good, have mercy on us\nSource of heavenly water, have mercy on us\nConsuming fire, have mercy on us\nArdent charity, have mercy on us\nSpiritual unction, have mercy on us\nSpirit of love and truth, have mercy on us\nSpirit of wisdom and understanding, have mercy on us\nSpirit of counsel and fortitude, have mercy on us\nSpirit of knowledge and piety, have mercy on us\nSpirit of the fear of the Lord, have mercy on us\nSpirit of grace and prayer, have mercy on us\nSpirit of peace and meekness, have mercy on us\nSpirit of modesty and innocence, have mercy on us\nHoly Ghost, the Comforter, have mercy on us\nHoly Ghost, the Sanctifier, have mercy on us\nHoly Ghost, Who governest the Church, have mercy on us\nGift of God, the Most High, have mercy on us\nSpirit Who fillest the universe, have mercy on us\nSpirit of the adoption of the children of God, have mercy on us\n\nHoly Ghost, inspire us with horror of sin.\nHoly Ghost, come and renew the face of the earth.\nHoly Ghost, shed Thy light in our souls.\nHoly Ghost, engrave Thy law in our hearts\nHoly Ghost, inflame us with the flame of Thy love.\nHoly Ghost, open to us the treasures of Thy graces\nHoly Ghost, teach us to pray well.\nHoly Ghost, enlighten us with Thy heavenly inspirations.\nHoly Ghost, lead us in the way of salvation\nHoly Ghost, grant us the only necessary knowledge.\nHoly Ghost, inspire in us the practice of good.\nHoly Ghost, grant us the merits of all virtues.\nHoly Ghost, make us persevere in justice.\nHoly Ghost, be Thou our everlasting reward.\n\nLamb of God, Who takest away the sins of the world, Send us Thy Holy Ghost.\n\nLamb of God, Who takest away the sins of the world, pour down into our souls the gifts of the Holy Ghost.\n\nLamb of God, Who takest away the sins of the world, grant us the Spirit of wisdom and piety.\n\nV. Come, Holy Ghost! Fill the hearts of Thy faithful,\nR. And enkindle in them the fire of Thy love.\n\nLet Us Pray. Grant, O merciful Father, that Thy Divine Spirit may enlighten, inflame and purify us, that He may penetrate us with His heavenly dew and make us fruitful in good works, through Our Lord Jesus Christ, Thy Son, Who with Thee, in the unity of the same Spirit, liveth and reigneth forever and ever.\n\nR. Amen.",
 "litany-loreto": "Lord, have mercy on us,\nChrist have mercy on us.\nLord, have mercy on us.\nChrist hear us.\nChrist, graciously hear us.\n\nGod the Father of Heaven, have mercy on us.\nGod the Son, Redeemer of the world, have mercy on us\nGod the Holy Ghost, have mercy on us.\nHoly Trinity, One God, have mercy on us.\n\nHoly Mary, pray for us\nHoly Mother of God, pray for us.\nHoly Virgin of virgins, pray for us.\nMother of Christ, pray for us.\nMother of divine grace, pray for us.\nMother most pure, pray for us.\nMother most chaste, pray for us.\nMother inviolate, pray for us.\nMother undefiled, pray for us.\nMother most amiable, pray for us.\nMother most admirable, pray for us.\nMother of good counsel, pray for us.\nMother of our Creator, pray for us.\nMother of our Saviour, pray for us.\nMother of the Church, pray for us.\nVirgin most prudent, pray for us.\nVirgin most venerable, pray for us.\nVirgin most renowned, pray for us.\nVirgin most powerful, pray for us.\nVirgin most merciful, pray for us.\nVirgin most faithful, pray for us.\nPreparation for Consecration, pray for us.\nMirror of justice, pray for us.\nSeat of wisdom, pray for us.\nCause of our joy, pray for us.\n\nVessel of honor, pray for us.\nSingular vessel of devotion, pray for us.\nMystical rose, pray for us.\nTower of David, pray for us.\nTower of ivory, pray for us.\nHouse of gold, pray for us.\nArk of the covenant, pray for us.\nGate of Heaven, pray for us.\nMorning star, pray for us.\nHealth of the sick, pray for us.\nRefuge of sinners, pray for us.\nComforter of the afflicted, pray for us.\nHelp of Christians, pray for us.\nQueen of angels, pray for us.\nQueen of patriarchs, pray for us.\nQueen of prophets, pray for us.\nQueen of Apostles, pray for us.\nQueen of martyrs, pray for us.\nQueen of confessors, pray for us.\nQueen of virgins, pray for us.\nQueen of all saints, pray for us.\nQueen conceived without Original Sin, pray for us.\nQueen assumed into Heaven, pray for us.\nQueen of the most holy Rosary, pray for us.\nQueen of peace, pray for us.\n\nLamb of God, Who takest away the sins of the world, Spare us, O Lord.\nLamb of God, Who takest away the sins of the world, Graciously hear us, O Lord.\nLamb of God, Who takest away the sins of the world, Have mercy on us.\n\nV. Pray for us, O holy Mother of God,\nR. That we may be made worthy of the promises of Christ.\n\nLet Us Pray. Grant, we beseech Thee, O Lord God, unto us Thy servants, that we may rejoice in continual health of mind and body, and by the glorious intercession of Blessed Mary, ever virgin, may be delivered from present sadness, and enter into the joy of Thine eternal gladness. Through Christ Our Lord.\n\nR. Amen",
 "montfort-prayer": "Hail Mary, beloved Daughter of the Eternal Father! Hail Mary, admirable Mother of the Son! Hail Mary, faithful spouse of the Holy Ghost! Hail Mary, my dear Mother, my loving Mistress, my powerful sovereign! Hail my joy, my glory, my heart and my soul! Thou art all mine by mercy, and I am all thine by justice. But I am not yet sufficiently thine. I now give myself wholly to thee without keeping anything back for myself or others. If thou still seest in me anything which does not belong to thee, I beseech thee to take it and to make thyself the absolute Mistress of all that is mine. Destroy in me all that may be displeasing to God, root it up and bring it to nought; place and cultivate in me everything that is pleasing to thee.\n\nMay the light of thy faith dispel the darkness of my mind; may thy profound humility take the place of my pride; may thy sublime contemplation check the distractions of my wandering imagination; may thy continuous sight of God fill my memory with His presence; may the burning love of thy heart inflame the lukewarmness of mine; may thy virtues take the place of my sins; may thy merits be my only adornment in the sight of God and make up for all that is wanting in me. Finally, dearly beloved Mother, grant, if it be possible, that I may have no other spirit but thine to know Jesus and His divine will; that I may have no other soul but thine to praise and glorify the Lord; that I may have no other heart but thine to love God with a love as pure and ardent as thine I do not ask thee for visions, revelations, sensible devotion or spiritual pleasures. It is thy privilege to see God clearly; it is thy privilege to enjoy heavenly bliss; it is thy privilege to triumph gloriously in Heaven at the right hand of thy Son and to hold absolute sway over angels, men and demons; it is thy privilege to dispose of all the gifts of God, just as thou willest.\n\nSuch is, O heavenly Mary, the \"best part,\" which the Lord has given thee and which shall never be taken away from thee—and this thought fills my heart with joy. As for my part here below, I wish for no other than that which was thine: to believe sincerely without spiritual pleasures; to suffer joyfully without human consolation; to die continually to myself without respite; and to work zealously and unselfishly for thee until death as the humblest of thy servants. The only grace I beg thee to obtain for me is that every day and every moment of my life I may say: Amen, so be it, to all that thou didst do while on earth; Amen, so be it, to all that thou art now doing in Heaven; Amen, so be it, to all that thou art doing in my soul, so that thou alone mayest fully glorify Jesus in me for time and eternity. Amen.",
 "rosary": "",
 "litany-holy-name": "Lord, have mercy on us.\nChrist, have mercy on us.\nLord, have mercy on us.\nJesus, hear us.\nJesus, graciously hear us.\n\nGod the Father of Heaven, have mercy on us.\nGod the Son, Redeemer of the world, have mercy on us.\nGod the Holy Ghost, have mercy on us.\nHoly Trinity, One God, have mercy on us.\nJesus, Son of the living God, have mercy on us.\nJesus, splendor of the Father, have mercy on us.\nJesus, brightness of eternal light, have mercy on us.\nJesus, King of glory, have mercy on us.\nJesus, sun of justice, have mercy on us.\nJesus, Son of the Virgin Mary, have mercy on us.\nJesus, most amiable, have mercy on us.\nJesus, most admirable, have mercy on us.\nJesus, mighty God, have mercy on us.\nJesus, Father of the world to come, have mercy on us.\nJesus, angel of great counsel, have mercy on us.\nJesus, most powerful, have mercy on us.\nJesus, most patient, have mercy on us.\nJesus, most obedient, have mercy on us.\nJesus, meek and humble, have mercy on us.\nJesus, lover of chastity, have mercy on us.\nJesus, lover of us, have mercy on us.\nJesus, God of peace, have mercy on us.\nJesus, author of life, have mercy on us.\nJesus, model of virtues, have mercy on us.\nJesus, lover of souls, have mercy on us.\nJesus, our God, have mercy on us.\nJesus, our refuge, have mercy on us.\nJesus, Father of the poor, have mercy on us.\nJesus, treasure of the faithful, have mercy on us.\nJesus, Good Shepherd, have mercy on us.\nJesus, true light, have mercy on us.\nJesus, eternal wisdom, have mercy on us.\nJesus, infinite goodness, have mercy on us.\nJesus, our way and our life, have mercy on us.\nJesus, joy of angels, have mercy on us.\nJesus, King of patriarchs, have mercy on us.\nJesus, master of Apostles, have mercy on us.\nJesus, teacher of Evangelists, have mercy on us.\nJesus, strength of martyrs, have mercy on us.\nJesus, light of confessors, have mercy on us.\nJesus, purity of virgins, have mercy on us.\nJesus, crown of all saints, have mercy on us.\n\nBe merciful, spare us, O Jesus.\nBe merciful, graciously hear us, O Jesus.\n\nFrom all evil, Jesus, deliver us.\nFrom all sin, Jesus, deliver us.\nFrom Thy wrath, Jesus, deliver us.\nFrom the snares of the devil, Jesus, deliver us.\nFrom the spirit of fornication, Jesus, deliver us.\nFrom everlasting death, Jesus, deliver us.\nFrom the neglect of Thine inspirations, Jesus, deliver us.\n\nThrough the mystery of Thy holy Incarnation, Jesus, deliver us.\nThrough Thy nativity, Jesus, deliver us.\nThrough Thine infancy, Jesus, deliver us.\nThrough Thy most divine life, Jesus, deliver us.\nThrough Thy labors, Jesus, deliver us.\nThrough Thine agony and Passion, Jesus, deliver us.\nThrough Thy cross and dereliction, Jesus, deliver us.\nThrough Thy sufferings, Jesus, deliver us.\nThrough Thy death and burial, Jesus, deliver us.\nThrough Thy Resurrection, Jesus, deliver us.\nThrough Thine Ascension, Jesus, deliver us.\nThrough Thine institution of the most Holy Eucharist, Jesus, deliver us.\nThrough Thy joys, Jesus, deliver us.\nThrough Thy glory, Jesus, deliver us.\n\nLamb of God, Who takest away the sins of the world, Spare us, O Jesus.\nLamb of God, Who takest away the sins of the world, Graciously hear us, O Jesus.\nLamb of God, Who takest away the sins of the world, Have mercy on us.\n\nJesus, hear us, Jesus, graciously hear us.\n\nLet Us Pray. O Lord Jesus Christ, Who hast said: Ask and ye shall receive, seek and ye shall find, knock and it shall be opened unto you; grant, we beseech Thee, to us who ask the gift of Thy divine love, that we may ever love Thee with all our hearts, and in all our words and actions, and never cease from praising Thee.\n\nGive us, O Lord, a perpetual fear and love of Thy holy Name; for Thou never failest to govern those whom Thou dost solidly establish in Thy love, Who livest and reignest world without end.\n\nR. Amen.",
 "o-jesus": "O Jesus living in Mary,\nCome and live in Thy servants,\nIn the spirit of Thy holiness,\nIn the fullness of Thy might,\nIn the truth of Thy virtues,\nIn the perfection of Thy ways,\nIn the communion of Thy mysteries;\nSubdue every hostile power\nIn Thy spirit, for the glory of the Father. Amen."
};
const CONS = ["On the day of consecration, either fast, give alms, or offer a votive candle for the good of another (or all of the above); do some spiritual penance and approach consecration in the spirit of mortification.", "Now go to Confession (or, if that is not possible, go during the 8 days prior) and then receive Communion with the intention of giving yourself to Jesus, as a slave of love, by the hands of Mary. Try to receive Communion per the method described in the Supplement of the book, \"True Devotion to the Blessed Virgin Mary\" above.", "Now pray the words of the consecration. Copy them and have them with you at church, read them after the Mass (in front of the tabernacle would be nice), and sign your copy of the Act of Consecration.", "The words of consecration are:", "O Eternal and incarnate Wisdom! O sweetest and most adorable Jesus! True God and true man, only Son of the Eternal Father, and of Mary, always virgin! I adore Thee profoundly in the bosom and splendors of Thy Father during eternity; and I adore Thee also in the virginal bosom of Mary, Thy most worthy Mother, in the time of Thine incarnation.", "I give Thee thanks for that Thou hast annihilated Thyself, taking the form of a slave in order to rescue me from the cruel slavery of the devil. I praise and glorify Thee for that Thou hast been pleased to submit Thyself to Mary, Thy holy Mother, in all things, in order to make me Thy faithful slave through her. But, alas! Ungrateful and faithless as I have been, I have not kept the promises which I made so solemnly to Thee in my Baptism; I have not fulfilled my obligations; I do not deserve to be called Thy child, nor yet Thy slave; and as there is nothing in me which does not merit Thine anger and Thy repulse, I dare not come by myself before Thy most holy and august Majesty. It is on this account that I have recourse to the intercession of Thy most holy Mother, whom Thou hast given me for a mediatrix with Thee. It is through her that I hope to obtain of Thee contrition, the pardon of my sins, and the acquisition and preservation of wisdom.", "Hail, then, O immaculate Mary, living tabernacle of the Divinity, where the Eternal Wisdom willed to be hidden and to be adored by angels and by men! Hail, O Queen of Heaven and earth, to whose empire everything is subject which is under God. Hail, O sure refuge of sinners, whose mercy fails no one. Hear the desires which I have of the Divine Wisdom; and for that end receive the vows and offerings which in my lowliness I present to thee.", "I, N_____, a faithless sinner, renew and ratify today in thy hands the vows of my Baptism; I renounce forever Satan, his pomps and works; and I give myself entirely to Jesus Christ, the Incarnate Wisdom, to carry my cross after Him all the days of my life, and to be more faithful to Him than I have ever been before. In the presence of all the heavenly court I choose thee this day for my Mother and Mistress. I deliver and consecrate to thee, as thy slave, my body and soul, my goods, both interior and exterior, and even the value of all my good actions, past, present and future; leaving to thee the entire and full right of disposing of me, and all that belongs to me, without exception, according to thy good pleasure, for the greater glory of God in time and in eternity.", "Receive, O benignant Virgin, this little offering of my slavery, in honor of, and in union with, that subjection which the Eternal Wisdom deigned to have to thy maternity; in homage to the power which both of you have over this poor sinner, and in thanksgiving for the privileges with which the Holy Trinity has favored thee. I declare that I wish henceforth, as thy true slave, to seek thy honor and to obey thee in all things.", "O admirable Mother, present me to thy dear Son as His eternal slave, so that as He has redeemed me by thee, by thee He may receive me! O Mother of mercy, grant me the grace to obtain the true Wisdom of God; and for that end receive me among those whom thou lovest and teachest, whom thou leadest, nourishest and protectest as thy children and thy slaves.", "O faithful Virgin, make me in all things so perfect a disciple, imitator and slave of the Incarnate Wisdom, Jesus Christ thy Son, that I may attain, by thine intercession and by thine example, to the fullness of His age on earth and of His glory in Heaven. Amen.", "Sign your name here.", "Date", "After Consecration", "Once you have consecrated yourself to Jesus through Mary, live that consecration. St. Louis-Marie de Montfort recommended the following:", "•   Keep praying to develop a \"great contempt\" for the spirit of this world", "•   Maintain a special devotion to the Mystery of the Incarnation (e.g., through meditation; spiritual reading; focusing on Feasts centering around the Incarnation, such as the Annunciation and the Nativity, etc.)", "•   Frequently recite the Ave, Rosary, and the Magnificat", "•   Recite, every day if it is not inconvenient, the \"Little Crown of the Blessed Virgin\" -- a series of Paters, Aves, and Glorias -- one Ave for each star in the Virgin's Crown. St. Louis has a special way of praying the Little Crown, which is recommended.", "•   Do everything through, with, in and for Mary for the sake of Jesus, with the prayer, \"I am all thine Immaculate One, with all that I have: in time and in eternity\" in your heart and on your lips", "•   Associate yourself with Mary in a special way before, during, and after Communion (see Supplement of the book, \"True Devotion to the Blessed Virgin Mary\" above)", "•   Wear a little iron chain (around the neck, arm, waist, or ankle) as an outward sign and reminder of holy slavery. This practice is optional, but very recommended by St. Louis. The appearance of this chain is not further specified.", "•   Renew the consecration once a year on the same date chosen above, and by following the same 33-day period of exercises. If desired, also renew the consecration monthly with the prayer, \"I am all thine and all I have is thine, O dear Jesus, through Mary, Thy holy Mother.\"", "•   Optional: Join the Confraternity of Mary, Queen of All Hearts. Their address:", "Director, Confraternity of Mary Queen of All Hearts 26 South Saxon Avenue Bay Shore, NY 11706"];

try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) state = Object.assign({}, defaults, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------- dates ---------- */
const MS = 86400000;
function ymd(dt) { return Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()); }
function todayUTC() { return ymd(new Date()); }
function fmt(utc, opts) { return new Date(utc).toLocaleDateString(undefined, Object.assign({ timeZone: "UTC" }, opts)); }
function feastObj() { return FEASTS.find(f => f.k === state.feast) || FEASTS[7]; }
function cycle(now) {
  now = now == null ? todayUTC() : now;
  const f = feastObj();
  const y = new Date(now).getUTCFullYear();
  let feast = Date.UTC(y, f.m - 1, f.d);
  if (feast < now) feast = Date.UTC(y + 1, f.m - 1, f.d);
  const start = feast - 33 * MS;
  const day = Math.round((now - start) / MS) + 1; // 1..34, or <1 if not begun
  return { feast, start, day, f };
}
function dateOfDay(n) { return cycle().start + (n - 1) * MS; }
function periodOf(n) { return PERIODS.find(p => n >= p.from && n <= p.to); }

/* ---------- helpers ---------- */
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
const CK = '<svg class="ck" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.8 8.6l3.4 3.3L13.2 4.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CHEV = '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const RESP = /^(.*?,\s*)((?:have mercy on us|pray for us|Jesus, deliver us|deliver us|save us|sanctify us|enter our hearts|hear us)\.?)$/;

function prayerHTML(key) {
  if (key === "rosary") return rosaryHTML();
  const text = PRAYERS[key] || "";
  const hymn = HYMNS.has(key);
  const stanzas = text.split(/\n\n+/).map(st => {
    const lines = st.split("\n").map(l => {
      let m;
      if ((m = l.match(/^([VR])\.\s*(.*)$/))) return `<span class="ln"><span class="vr">${m[1] === "V" ? "℣" : "℟"}</span>${esc(m[2])}</span>`;
      if (!hymn && (m = l.match(RESP)) && m[1].length > 2) return `<span class="ln">${esc(m[1])}<span class="resp">${esc(m[2])}</span></span>`;
      return `<span class="ln">${esc(l)}</span>`;
    }).join("");
    return `<p class="st">${lines}</p>`;
  }).join("");
  return `<div class="prayer${hymn ? " hymn" : ""}">${stanzas}</div>`;
}

function rosaryHTML(now) {
  const wd = new Date((now == null ? Date.now() : now)).getDay();
  const set = MYSTERY_BY_WEEKDAY[wd];
  const dayName = new Date().toLocaleDateString(undefined, { weekday: "long" });
  return `<div class="prayer">
    <p class="st note">Your PDF lists the Rosary for the second week but doesn’t print it, so the usual form is added here.</p>
    <h4>Today (${esc(dayName)}): the ${set} Mysteries</h4>
    <ol>${MYSTERIES[set].map(m => `<li>${esc(m)}</li>`).join("")}</ol>
    <p class="st note">Mondays and Saturdays: Joyful. Tuesdays and Fridays: Sorrowful. Wednesdays and Sundays: Glorious. Thursdays: Luminous.</p>
    <h4>Each decade</h4>
    <p class="st">Announce the mystery, then pray one Our Father, ten Hail Marys, and one Glory Be.</p>
    <h4>Our Father</h4>
    <p class="st">Our Father, Who art in heaven, hallowed be Thy name; Thy kingdom come; Thy will be done on earth as it is in heaven. Give us this day our daily bread; and forgive us our trespasses as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen.</p>
    <h4>Hail Mary</h4>
    <p class="st">Hail Mary, full of grace, the Lord is with thee; blessed art thou among women, and blessed is the fruit of thy womb, Jesus. Holy Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen.</p>
    <h4>Glory Be</h4>
    ${prayerHTML("glory")}
    <h4>Hail, Holy Queen (to close)</h4>
    <p class="st">Hail, holy Queen, Mother of mercy, our life, our sweetness and our hope. To thee do we cry, poor banished children of Eve; to thee do we send up our sighs, mourning and weeping in this valley of tears. Turn then, most gracious advocate, thine eyes of mercy toward us; and after this our exile, show unto us the blessed fruit of thy womb, Jesus. O clement, O loving, O sweet Virgin Mary.</p>
  </div>`;
}

/* ---------- views ---------- */
function blocksHTML(d) {
  return d.blocks.map(b => b.t === "p" ? `<p>${esc(b.x)}</p>` : `<div class="${b.t}">${esc(b.x)}</div>`).join("");
}

function viewDay(n, isTodayView) {
  const c = cycle();
  const p = periodOf(n);
  const d = DAYS[n - 1];
  const isToday = n === c.day;
  const daysLeft = Math.round((c.feast - todayUTC()) / MS);
  const said = state.said[n] || [];
  const done = !!state.done[n];

  let lead = esc(p.label);
  let sub = `${esc(p.focus)}<br>` + fmt(dateOfDay(n), { weekday: "long", day: "numeric", month: "long" });
  if (isToday && daysLeft > 0) sub += `<br>${daysLeft} day${daysLeft === 1 ? "" : "s"} to ${esc(c.f.name)}`;
  if (isTodayView && c.day < 1) sub = `Your preparation begins ${fmt(c.start, { weekday: "long", day: "numeric", month: "long" })}`;

  const plist = p.prayers.map(k => {
    const on = said.includes(k);
    return `<div class="pitem" data-key="${k}" data-said="${on}">
      <button class="pname" type="button" data-act="toggle" aria-expanded="false"><span>${esc(PRAYER_NAMES[k])}</span><span class="ico">${on ? "prayed " + CK : ""}</span></button>
      <div class="pbody">${prayerHTML(k)}
        <button class="amen" type="button" data-act="said" data-day="${n}" data-key="${k}">${on ? "Mark as not prayed" : "Amen · mark as prayed"}</button>
      </div>
    </div>`;
  }).join("");

  const prev = n > 1 ? `#day-${n - 1}` : "#";
  const next = n < 33 ? `#day-${n + 1}` : "#consecration";

  return `
    <header class="head">
      <div class="kicker sc">${lead}</div>
      <h1>Day ${n}${done ? ` <span class="red ck-big" aria-label="done">${CK}</span>` : ""}</h1>
      <div class="rule"></div>
      <p>${sub}</p>
    </header>
    <section class="reading">${blocksHTML(d)}</section>
    <h2 class="sc">Prayers</h2>
    <div class="plist">${plist}</div>
    <button class="mark${done ? " isdone" : ""}" type="button" data-act="done" data-day="${n}">${done ? "Day " + n + " complete · undo" : "Mark day complete"}</button>
    <nav class="pager" aria-label="Other days">
      <a href="${prev}" aria-disabled="${n === 1}">‹ Day ${n - 1}</a>
      <a href="${next}">${n < 33 ? "Day " + (n + 1) : "Consecration"} ›</a>
    </nav>`;
}

function viewToday() {
  const c = cycle();
  if (c.day >= 1 && c.day <= 33) return viewDay(c.day, true);
  if (c.day === 34) return viewCons(true);
  return viewDay(1, true);
}

function shortSrc(d) {
  return d.blocks.filter(b => b.t === "src").map(b => b.x.replace(/^From /, "").replace(/, by Thomas á Kempis/, "").replace(/ To the Blessed Virgin Mary| to the Blessed Virgin Mary/i, "")).join("; ");
}

function viewDays() {
  const c = cycle();
  const doneCount = Object.keys(state.done).filter(k => state.done[k] && +k <= 33).length;
  const sections = PERIODS.map(p => {
    let rows = "";
    for (let n = p.from; n <= p.to; n++) {
      const st = state.done[n] ? `<span aria-label="done">${CK}</span>` : n === c.day ? "today" : "";
      rows += `<a class="drow" href="#day-${n}">
        <span class="num">${n}</span>
        <span class="info">${fmt(dateOfDay(n), { weekday: "short", day: "numeric", month: "short" })}<span>${esc(shortSrc(DAYS[n - 1]))}</span></span>
        <span class="state">${st}</span></a>`;
    }
    return `<h2 class="sc">${esc(p.label)}</h2><p class="period-note">${esc(p.focus)}</p><div class="dlist">${rows}</div>`;
  }).join("");
  return `
    <header class="head">
      <div class="kicker sc">${doneCount} of 33 complete</div>
      <h1>Thirty-Three Days</h1>
      <div class="rule"></div>
      <p>${fmt(c.start, { day: "numeric", month: "long" })} to ${fmt(c.feast - MS, { day: "numeric", month: "long" })}</p>
    </header>
    ${sections}
    <h2 class="sc">Day 34</h2>
    <div class="dlist"><a class="drow" href="#consecration"><span class="num">34</span><span class="info">${fmt(c.feast, { weekday: "short", day: "numeric", month: "short" })}<span>Consecration, ${esc(c.f.name)}</span></span><span class="state">${c.day === 34 ? "today" : ""}</span></a></div>`;
}

function viewPrayers() {
  const used = k => PERIODS.filter(p => p.prayers.includes(k)).map(p => p.id === "prep" ? "days 1–12" : p.label.replace(" Week", " week").toLowerCase()).join(", ");
  return `
    <header class="head">
      <div class="kicker sc">Appendix</div>
      <h1>Prayers</h1>
      <div class="rule"></div>
      <p>Recited throughout the consecration</p>
    </header>
    <div class="plinks">${PRAYER_ORDER.map(k => `<a href="#prayer-${k}">${esc(PRAYER_NAMES[k])}<span>${esc(used(k))}</span></a>`).join("")}
      <a href="#consecration">Act of Consecration<span>day 34</span></a></div>`;
}

function viewPrayer(k) {
  if (!PRAYER_NAMES[k]) return viewPrayers();
  return `
    <a class="back" href="#prayers">‹ Prayers</a>
    <header class="head">
      <h1>${esc(PRAYER_NAMES[k])}</h1>
      <div class="rule"></div>
    </header>
    ${prayerHTML(k)}`;
}

function actHTML() {
  const name = state.name.trim();
  return CONS.slice(4, 11).map(p => {
    let h = esc(p);
    h = h.replace(/N_+/, name ? `<span class="nm">${esc(name)}</span>` : "N.");
    return `<p>${h}</p>`;
  }).join("");
}

function viewCons(isTodayView) {
  const c = cycle();
  const instr = CONS.slice(0, 4).map(p => `<p>${esc(p)}</p>`).join("");
  const after = CONS.slice(15, 24).map(p => `<li>${esc(p.replace(/^•\s*/, ""))}</li>`).join("");
  return `
    <header class="head">
      <div class="kicker sc">Day 34${isTodayView ? " · today" : ""}</div>
      <h1>Day of Consecration</h1>
      <div class="rule"></div>
      <p>${esc(cap(c.f.name))}, ${fmt(c.feast, { weekday: "long", day: "numeric", month: "long" })}</p>
    </header>
    <section class="prose">${instr}</section>
    <h2 class="sc">Act of Consecration</h2>
    <label class="field" for="nm"><span>Your name, for “I, N.”</span>
      <input id="nm" type="text" autocomplete="name" value="${esc(state.name)}">
    </label>
    <section class="act" id="act">${actHTML()}</section>
    <div class="sign"><div>Sign your name here.</div><div>Date</div></div>
    <h2 class="sc">After Consecration</h2>
    <section class="prose"><p>${esc(CONS[14])}</p><ul>${after}</ul><p class="soft it">${esc(CONS[24])}</p></section>`;
}

function viewSetup() {
  const c = cycle();
  const opts = FEASTS.map(f => `<option value="${f.k}"${f.k === state.feast ? " selected" : ""}>${esc(cap(f.name))}, ${fmt(Date.UTC(2001, f.m - 1, f.d), { day: "numeric", month: "long" })}</option>`).join("");
  const sizes = [[0.9, "Small"], [1, "Normal"], [1.15, "Large"], [1.3, "Larger"]];
  return `
    <header class="head">
      <div class="kicker sc">Setup</div>
      <h1>Feast and Settings</h1>
      <div class="rule"></div>
    </header>
    <label class="field" for="feast"><span>Feast of consecration</span>
      <select id="feast">${opts}</select>
    </label>
    <p class="soft it">Day 1 is ${fmt(c.start, { weekday: "long", day: "numeric", month: "long" })}; the consecration is ${fmt(c.feast, { weekday: "long", day: "numeric", month: "long" })}. St. Louis de Montfort recommends the Annunciation most of all.</p>
    <h2 class="sc">Appearance</h2>
    <div class="seg">${[["auto", "Automatic"], ["light", "Light"], ["dark", "Dark"]].map(([v, l]) => `<button type="button" data-act="mode" data-v="${v}" aria-pressed="${state.mode === v}">${l}</button>`).join("")}</div>
    <p class="soft it" style="text-align:center;font-size:.86em;margin:.6em 0 0">Automatic follows your phone’s setting.</p>
    <h2 class="sc">Text size</h2>
    <div class="seg">${sizes.map(([v, l]) => `<button type="button" data-act="scale" data-v="${v}" aria-pressed="${state.scale == v}">${l}</button>`).join("")}</div>
    <h2 class="sc">The Thirty-Three Days</h2>
    <section class="prose">
      <p>First come twelve days of preparation, emptying oneself of the spirit of the world, with the Veni Creator, Ave Maris Stella, Magnificat and Glory Be.</p>
      <p>Then three weeks, each with its own prayers: knowledge of self, knowledge of the Blessed Virgin, and knowledge of Jesus Christ. The following day, the feast itself, is the consecration.</p>
      <p class="it">Don’t just read the readings, internalize them; don’t let your lips just mouth the prayers, truly pray them.</p>
    </section>
    <h2 class="sc">Progress</h2>
    <p class="soft it" style="text-align:center">Check marks are kept on this phone only. <button class="textbtn" type="button" data-act="reset">Clear them</button></p>`;
}

/* ---------- router ---------- */
const app = document.getElementById("app");
function route() {
  const h = (location.hash || "#today").slice(1);
  let html, tab = "today";
  let m;
  if ((m = h.match(/^day-(\d+)$/)) && +m[1] >= 1 && +m[1] <= 33) { html = viewDay(+m[1], false); tab = +m[1] === cycle().day ? "today" : "days"; }
  else if (h === "days") { html = viewDays(); tab = "days"; }
  else if (h === "prayers") { html = viewPrayers(); tab = "prayers"; }
  else if ((m = h.match(/^prayer-([a-z-]+)$/))) { html = viewPrayer(m[1]); tab = "prayers"; }
  else if (h === "consecration") { html = viewCons(cycle().day === 34); tab = "consecration"; }
  else if (h === "setup") { html = viewSetup(); tab = "setup"; }
  else { html = viewToday(); tab = "today"; }
  app.innerHTML = html;
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  bind();
}
function rerender(keepScroll) { const y = window.scrollY; route(); if (keepScroll) window.scrollTo(0, y); }

function applyMode() {
  const root = document.documentElement;
  if (state.mode === "light" || state.mode === "dark") root.setAttribute("data-mode", state.mode); else root.removeAttribute("data-mode");
}
function applyScale() { document.documentElement.style.setProperty("--scale", state.scale); }

function bind() {
  const feast = document.getElementById("feast");
  if (feast) feast.addEventListener("change", e => { state.feast = e.target.value; save(); rerender(true); });
  const nm = document.getElementById("nm");
  if (nm) nm.addEventListener("input", e => { state.name = e.target.value; save(); document.getElementById("act").innerHTML = actHTML(); });
}

app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "toggle") {
    const item = b.closest(".pitem");
    const open = item.classList.toggle("open");
    b.setAttribute("aria-expanded", open);
  } else if (act === "said") {
    const n = b.dataset.day, k = b.dataset.key;
    const list = state.said[n] || (state.said[n] = []);
    const i = list.indexOf(k);
    if (i >= 0) list.splice(i, 1); else list.push(k);
    const on = i < 0;
    const item = b.closest(".pitem");
    item.dataset.said = on;
    item.querySelector(".ico").innerHTML = on ? "prayed " + CK : "";
    b.textContent = on ? "Mark as not prayed" : "Amen · mark as prayed";
    const p = periodOf(+n);
    if (on) {
      item.classList.remove("open");
      item.querySelector(".pname").setAttribute("aria-expanded", "false");
      if (p.prayers.every(x => list.includes(x)) && !state.done[n]) { state.done[n] = true; save(); rerender(true); return; }
      const next = [...document.querySelectorAll(".pitem")].find(x => x.dataset.said !== "true");
      if (next) {
        next.classList.add("open");
        next.querySelector(".pname").setAttribute("aria-expanded", "true");
        const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        next.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
      } else {
        item.scrollIntoView({ block: "nearest" });
      }
    }
    save();
  } else if (act === "done") {
    const n = b.dataset.day;
    if (state.done[n]) delete state.done[n]; else state.done[n] = true;
    save(); rerender(true);
  } else if (act === "mode") {
    state.mode = b.dataset.v; save(); applyMode(); rerender(true);
  } else if (act === "scale") {
    state.scale = +b.dataset.v; save(); applyScale(); rerender(true);
  } else if (act === "reset") {
    if (b.dataset.confirm) { state.done = {}; state.said = {}; save(); rerender(true); }
    else { b.dataset.confirm = "1"; b.textContent = "tap again to confirm"; }
  }
});

window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
applyScale();
applyMode();
route();
// roll over to the next day if the app is left open past midnight
let lastDay = todayUTC();
setInterval(() => { if (todayUTC() !== lastDay) { lastDay = todayUTC(); rerender(true); } }, 60000);
/* ---------- install + first-launch screens (only on the real website, never inside Claude) ---------- */
const FLAGS_KEY = "montfort-consecration-flags";
let flags = {};
try { flags = JSON.parse(localStorage.getItem(FLAGS_KEY) || "{}") || {}; } catch (e) {}
function saveFlags() { try { localStorage.setItem(FLAGS_KEY, JSON.stringify(flags)); } catch (e) {} }

const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
const UA = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(UA);
const inAppBrowser = /FBAN|FBAV|Instagram|Line\/|Snapchat|TikTok|musical_ly|LinkedInApp|GSA\//.test(UA);
let installEvent = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvent = e; if (!document.getElementById("onboard").hidden) showInstall(); });

const SHARE_ICON = '<svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Share button"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11v9h12v-9"/></svg>';
const onboard = document.getElementById("onboard");

function shell(inner) {
  onboard.innerHTML = `<div class="ob">
    <img class="ob-icon" src="apple-touch-icon.png" alt="" width="84" height="84">
    <h1>Total Consecration</h1>
    <p class="ob-sub">St. Louis de Montfort’s 33-day preparation</p>
    ${inner}
  </div>`;
  onboard.hidden = false;
  document.body.classList.add("ob-open");
}
function closeOnboard() { onboard.hidden = true; onboard.innerHTML = ""; document.body.classList.remove("ob-open"); }

function showInstall() {
  let steps;
  if (inAppBrowser) {
    steps = `<p class="ob-lead">Open this page in your browser first</p>
      <ol class="ob-steps">
        <li>Tap the <b>•••</b> or share button in this app’s corner.</li>
        <li>Choose <b>Open in Safari</b> (or <b>Open in browser</b> on Android).</li>
        <li>Then follow the steps to add it to your home screen.</li>
      </ol>`;
  } else if (isIOS) {
    steps = `<p class="ob-lead">Add it to your home screen</p>
      <ol class="ob-steps">
        <li>Tap the Share button ${SHARE_ICON} in Safari. On newer iPhones, tap <b>•••</b> first, then <b>Share</b>.</li>
        <li>Scroll down and tap <b>Add to Home Screen</b>.</li>
        <li>Tap <b>Add</b>. If you see <b>Open as Web App</b>, leave it on.</li>
        <li>Open <b>Consecration</b> from your home screen from now on.</li>
      </ol>`;
  } else if (isAndroid) {
    steps = installEvent
      ? `<p class="ob-lead">Add it to your home screen</p><button class="ob-btn" type="button" id="ob-install">Install app</button>`
      : `<p class="ob-lead">Add it to your home screen</p>
        <ol class="ob-steps">
          <li>Tap the <b>⋮</b> menu in Chrome.</li>
          <li>Tap <b>Add to Home screen</b> or <b>Install app</b>.</li>
          <li>Open <b>Consecration</b> from your home screen from now on.</li>
        </ol>`;
  } else {
    steps = `<p class="ob-lead">Made for your phone</p>
      <p class="ob-text">Open this link on your phone to add it to your home screen. You can also read it here.</p>
      ${installEvent ? `<button class="ob-btn" type="button" id="ob-install">Install on this computer</button>` : ""}`;
  }
  shell(`${steps}
    <p class="ob-note">Your check marks are saved in whichever one you use, so stick to the home screen app.</p>
    <button class="ob-skip" type="button" id="ob-skip">Continue in browser</button>`);
  document.getElementById("ob-skip").onclick = () => { flags.installSkipped = true; saveFlags(); closeOnboard(); };
  const ib = document.getElementById("ob-install");
  if (ib) ib.onclick = async () => {
    if (!installEvent) return;
    installEvent.prompt();
    try { await installEvent.userChoice; } catch (e) {}
    installEvent = null;
    flags.installSkipped = true; saveFlags(); closeOnboard();
  };
}

function showWelcome() {
  const c = cycle();
  const modes = [["auto", "Automatic"], ["light", "Light"], ["dark", "Dark"]];
  shell(`<p class="ob-lead">Welcome</p>
    <ul class="ob-list">
      <li>It opens to <b>today’s day</b> on its own, counting toward ${esc(c.f.name)}, ${fmt(c.feast, { month: "long", day: "numeric" })}.</li>
      <li>Read the day’s reading, then <b>tap each prayer</b> to open it.</li>
      <li>Tap <b>Amen</b> at the end of a prayer to mark it prayed.</li>
      <li><b>Setup</b> lets you change the feast and the text size.</li>
    </ul>
    <p class="ob-lead small">Appearance</p>
    <div class="seg" id="ob-mode">${modes.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${state.mode === v}">${l}</button>`).join("")}</div>
    <button class="ob-btn" type="button" id="ob-begin">Begin</button>`);
  document.getElementById("ob-mode").onclick = e => {
    const b = e.target.closest("button[data-v]"); if (!b) return;
    state.mode = b.dataset.v; save(); applyMode();
    document.querySelectorAll("#ob-mode button").forEach(x => x.setAttribute("aria-pressed", x === b));
  };
  document.getElementById("ob-begin").onclick = () => { flags.welcomed = true; saveFlags(); closeOnboard(); };
}

if (!inFrame) {
  if (isStandalone) { if (!flags.welcomed) showWelcome(); }
  else if (!flags.installSkipped) showInstall();
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
}
</script>
</body>
</html>
